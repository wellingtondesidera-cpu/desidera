<script>
  window.__storageLog = [];
  function logStorage(entry) {
    entry.ts = new Date().toLocaleTimeString("pt-BR");
    window.__storageLog.unshift(entry);
    window.__storageLog = window.__storageLog.slice(0, 20);
    window.dispatchEvent(new CustomEvent("storage-debug", { detail: entry }));
  }
  window.storage = {
    async get(key) {
      try {
        const res = await fetch("/.netlify/functions/storage?key=" + encodeURIComponent(key));
        if (res.status === 404) {
          // nada salvo no compartilhado ainda: se existir algo local (de uso anterior
          // ao armazenamento compartilhado), usa isso e já sobe pro compartilhado
          const cached = localStorage.getItem(key);
          if (cached !== null) {
            fetch("/.netlify/functions/storage?key=" + encodeURIComponent(key), {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ value: cached }),
            }).then((r) => logStorage({ op: "migrar", key, status: r.status, ok: r.ok }))
              .catch((e) => logStorage({ op: "migrar", key, error: String(e) }));
            logStorage({ op: "get", key, status: 404, note: "sem dado compartilhado, usando cache local" });
            return { key, value: cached, shared: false };
          }
          logStorage({ op: "get", key, status: 404, note: "sem dado compartilhado nem cache local" });
          throw new Error("not found: " + key);
        }
        if (!res.ok) {
          let body = "";
          try { body = await res.text(); } catch (_) {}
          logStorage({ op: "get", key, status: res.status, error: body });
          throw new Error("storage get failed: " + res.status);
        }
        const data = await res.json();
        localStorage.setItem(key, data.value); // cache local pra abrir rápido da próxima vez
        logStorage({ op: "get", key, status: 200, ok: true });
        return { key, value: data.value, shared: true };
      } catch (networkErr) {
        // sem rede/função indisponível: tenta cache local como último recurso
        logStorage({ op: "get", key, error: String(networkErr) });
        const v = localStorage.getItem(key);
        if (v === null) { throw networkErr; }
        return { key, value: v, shared: false };
      }
    },
    async set(key, value) {
      localStorage.setItem(key, value); // grava local na hora, pra não travar a interface
      try {
        const res = await fetch("/.netlify/functions/storage?key=" + encodeURIComponent(key), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ value }),
        });
        if (!res.ok) {
          let body = "";
          try { body = await res.text(); } catch (_) {}
          logStorage({ op: "set", key, status: res.status, error: body });
          throw new Error("storage set failed: " + res.status);
        }
        logStorage({ op: "set", key, status: 200, ok: true });
        return { key, value, shared: true };
      } catch (networkErr) {
        logStorage({ op: "set", key, error: String(networkErr) });
        throw networkErr;
      }
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    }
  };
</script>

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function fmtDateShort(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

  return `${yr}-${mo}-${da}`;
}

function Painel() {
  const [tab, setTab] = useState("cadastro");
  const [debugLog, setDebugLog] = useState([]);
  const [showDebug, setShowDebug] = useState(false);
  const [corretores, setCorretores] = useState(INITIAL_CORRETORES);
  const [escala, setEscala] = useState({});
  const [weekStart, setWeekStart] = useState(toISODate(mondayOf(new Date())));
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [printBlocked, setPrintBlocked] = useState(false);

  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(EMPTY_FORM);
  const [addingPlantao, setAddingPlantao] = useState(false);
  const [novoPlantao, setNovoPlantao] = useState("");
  const [plantaoOptions, setPlantaoOptions] = useState(PLANTAO_OPTIONS);

  // ---- diagnóstico de sincronização ----
  useEffect(() => {
    const handler = (ev) => setDebugLog((prev) => [ev.detail, ...prev].slice(0, 20));
    window.addEventListener("storage-debug", handler);
    return () => window.removeEventListener("storage-debug", handler);
  }, []);

  // ---- load persisted state ----
  useEffect(() => {
    (async () => {
      try {
        const c = await window.storage.get("desidera-corretores");
        if (c && c.value) {
          let stored = JSON.parse(c.value);
          // migração: garante status em cadastros salvos antes desse campo existir
          stored = stored.map((c) => ({ status: "Ativo", ...c, status: c.status || "Ativo" }));
          // migração: inclui o corretor Prisma se ainda não estiver na lista salva
          if (!stored.some((c) => c.apelido.trim().toLowerCase() === "prisma")) {
            const nextId = stored.length ? Math.max(...stored.map((c) => c.id)) + 1 : 1;
            stored = [...stored, { id: nextId, apelido: "Prisma", tel: "11 95783-2656", creci: "250137", funcao: "Corretor", tipo: "Salão", plantao: "Lenns Moema", status: "Aguardando Contrato" }];
          }
          setCorretores(stored);
        }
      } catch (e) {
        /* no saved data yet */
      }
      try {
        const e = await window.storage.get("desidera-escala");
        if (e && e.value) setEscala(JSON.parse(e.value));
      } catch (e) {
        /* no saved data yet */
      }
      try {
        const p = await window.storage.get("desidera-plantoes");
        if (p && p.value) {
          let stored = JSON.parse(p.value);
          if (!stored.includes("Lenns Moema")) stored = [...stored, "Lenns Moema"];
          setPlantaoOptions(stored);
        }
      } catch (e) {
        /* no saved data yet */
      }
      setLoaded(true);
    })();
  }, []);

  const persist = async (key, value) => {
    setSaving(true);
    try {
      await window.storage.set(key, JSON.stringify(value));
    } catch (e) {
      console.error("Falha ao salvar", key, e);
    }
    setSaving(false);
  };

  useEffect(() => {
    if (loaded) persist("desidera-corretores", corretores);
  }, [corretores, loaded]);

  useEffect(() => {
    if (loaded) persist("desidera-escala", escala);
  }, [escala, loaded]);

  useEffect(() => {
    if (loaded) persist("desidera-plantoes", plantaoOptions);
  }, [plantaoOptions, loaded]);

  const weekDates = useMemo(() => {
    const start = mondayOf(new Date(weekStart + "T00:00:00"));
    return DIAS.map((_, i) => {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      return d;
    });
  }, [weekStart]);

  // ---- cadastro handlers ----
  function startEdit(c) {
    setEditingId(c.id);
    setForm({ apelido: c.apelido, tel: c.tel, creci: c.creci, funcao: c.funcao, tipo: c.tipo, plantao: c.plantao, status: c.status || "Ativo" });
  }

  function startNew() {
    setEditingId("new");
    setForm(EMPTY_FORM);
  }

  function cancelEdit() {
    setEditingId(null);
    setForm(EMPTY_FORM);
  }

  function saveForm() {
    if (!form.apelido.trim()) return;
    if (editingId === "new") {
      const nextId = corretores.length ? Math.max(...corretores.map((c) => c.id)) + 1 : 1;
      setCorretores([...corretores, { id: nextId, ...form }]);
    } else {
      setCorretores(corretores.map((c) => (c.id === editingId ? { ...c, ...form } : c)));
    }
    cancelEdit();
  }

  function removeCorretor(id) {
    setCorretores(corretores.filter((c) => c.id !== id));
    setEscala((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((k) => {
        if (next[k] === id) delete next[k];
      });
      return next;
    });
  }

  function confirmAddPlantao() {
    const v = novoPlantao.trim();
    if (v && !plantaoOptions.includes(v)) {
      setPlantaoOptions([...plantaoOptions, v]);
      setForm({ ...form, plantao: v });
    }
    setNovoPlantao("");
    setAddingPlantao(false);
  }

  // ---- escala handlers ----
  function setCell(cellKey, corretorId) {
    setEscala((prev) => {
      const next = { ...prev };
      if (!corretorId) delete next[cellKey];
      else next[cellKey] = Number(corretorId);
      return next;
    });
  }

  function handlePrint() {
    const dataStr = new Date().toLocaleDateString("pt-BR");
    const rows = corretoresOrdenados.map((c, i) => `

      </tr>`).join("");

    const html = `<!DOCTYPE html>

</style></head>

  </div>

    <tbody>${rows}</tbody>
  </table>
  <div class="legend-print">
    <span><span class="dot" style="background:${tipoColor("Híbrido")}"></span>Híbrido (${counts.tipo["Híbrido"]})</span>

    <span><span class="dot" style="background:${statusColor("Aguardando Interação")}"></span>Aguardando interação (${counts.status["Aguardando Interação"]})</span>
  </div>
  <script>window.onload = function () { window.print(); };<\/script>
</body></html>`;

    const win = window.open("", "_blank", "width=900,height=1000");
    if (win) {
      win.document.open();
      win.document.write(html);
      win.document.close();
      setPrintBlocked(false);
      return;
    }

    // pop-ups bloqueados pelo ambiente: baixa o arquivo para impressão manual
    const blob = new Blob([html], { type: "text/html" });

    const a = document.createElement("a");
    a.href = url;
    a.download = "status-corretores-desidera.html";

    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setPrintBlocked(true);

                      <td><input className="cad-input" value={form.apelido} onChange={(e) => setForm({ ...form, apelido: e.target.value })} /></td>
                      <td className="col-tel"><input className="cad-input" value={form.tel} onChange={(e) => setForm({ ...form, tel: e.target.value })} /></td>
                      <td><input className="cad-input" value={form.creci} onChange={(e) => setForm({ ...form, creci: e.target.value })} /></td>
                      <td>
                        <select className="cad-select" value={form.funcao} onChange={(e) => setForm({ ...form, funcao: e.target.value })}>
                          <option>Corretor</option>
                          <option>Corretora</option>
                        </select>
                      </td>
                      <td>
                        <select className="cad-select" value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })}>
                          <option>Híbrido</option>
                          <option>Salão</option>
                        </select>
                      </td>
                      <td>
                        {!addingPlantao ? (
                          <select className="cad-select" value={form.plantao} onChange={(e) => {
                            if (e.target.value === "__new__") { setAddingPlantao(true); }
                            else setForm({ ...form, plantao: e.target.value });
                          }}>
                            {plantaoOptions.map((p) => <option key={p}>{p}</option>)}
                            <option value="__new__">+ novo plantão…</option>
                          </select>
                        ) : (
                          <div style={{ display: "flex", gap: 4 }}>
                            <input className="cad-input" autoFocus placeholder="Nome do plantão" value={novoPlantao} onChange={(e) => setNovoPlantao(e.target.value)} onKeyDown={(e) => e.key === "Enter" && confirmAddPlantao()} />
                            <button className="btn sm" onClick={confirmAddPlantao}>OK</button>
                          </div>
                        )}
                      </td>
                      <td>
                        <select className="cad-select" value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                          {STATUS_OPTIONS.map((s) => <option key={s}>{s}</option>)}
                        </select>
                      </td>
                      <td>
                        <div className="row-actions">
                          <button className="btn sm" onClick={saveForm}>Salvar</button>
                          <button className="btn sm ghost" onClick={cancelEdit}>Cancelar</button>
                        </div>
                      </td>
                    </tr>
                  ) : (
                    <tr key={c.id}>
                      <td>{i + 1}</td>
                      <td>{c.apelido}</td>
                      <td className="col-tel">{c.tel}</td>
                      <td>{c.creci || "—"}</td>
                      <td>{c.funcao}</td>
                      <td><span className="tipo-dot" style={{ background: tipoColor(c.tipo) }} />{c.tipo}</td>
                      <td>{c.plantao}</td>
                      <td><span className="status-badge" style={{ background: statusColor(c.status) + "1A", color: statusColor(c.status), borderColor: statusColor(c.status) + "55" }}>{c.status}</span></td>
                      <td>
                        <div className="row-actions">
                          <button className="btn sm ghost" onClick={() => startEdit(c)}>Editar</button>
                          <button className="btn sm danger" onClick={() => removeCorretor(c.id)}>Excluir</button>
                        </div>
                      </td>
                    </tr>
                  )
                ))}

                {editingId === "new" && (
                  <tr className="form-row">
                    <td>{corretores.length + 1}</td>
                    <td><input className="cad-input" placeholder="Apelido" value={form.apelido} onChange={(e) => setForm({ ...form, apelido: e.target.value })} /></td>
                    <td className="col-tel"><input className="cad-input" placeholder="11 90000-0000" value={form.tel} onChange={(e) => setForm({ ...form, tel: e.target.value })} /></td>
                    <td><input className="cad-input" placeholder="Creci" value={form.creci} onChange={(e) => setForm({ ...form, creci: e.target.value })} /></td>
                    <td>
                      <select className="cad-select" value={form.funcao} onChange={(e) => setForm({ ...form, funcao: e.target.value })}>
                        <option>Corretor</option>
                        <option>Corretora</option>
                      </select>
                    </td>
                    <td>
                      <select className="cad-select" value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })}>
                        <option>Híbrido</option>
                        <option>Salão</option>
                      </select>
                    </td>
                    <td>
                      {!addingPlantao ? (
                        <select className="cad-select" value={form.plantao} onChange={(e) => {
                          if (e.target.value === "__new__") { setAddingPlantao(true); }
                          else setForm({ ...form, plantao: e.target.value });
                        }}>
                          {plantaoOptions.map((p) => <option key={p}>{p}</option>)}
                          <option value="__new__">+ novo plantão…</option>
                        </select>
                      ) : (
                        <div style={{ display: "flex", gap: 4 }}>
                          <input className="cad-input" autoFocus placeholder="Nome do plantão" value={novoPlantao} onChange={(e) => setNovoPlantao(e.target.value)} onKeyDown={(e) => e.key === "Enter" && confirmAddPlantao()} />
                          <button className="btn sm" onClick={confirmAddPlantao}>OK</button>
                        </div>
                      )}
                    </td>
                    <td>
                      <select className="cad-select" value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                        {STATUS_OPTIONS.map((s) => <option key={s}>{s}</option>)}
                      </select>
                    </td>
                    <td>
                      <div className="row-actions">
                        <button className="btn sm" onClick={saveForm}>Salvar</button>
                        <button className="btn sm ghost" onClick={cancelEdit}>Cancelar</button>
                      </div>
                    </td>
                  </tr>
                )}
              </tbody>
            </table>

            <div className="legend">
              <span><span className="tipo-dot" style={{ background: tipoColor("Híbrido") }} /> Híbrido ({counts.tipo["Híbrido"]})</span>
              <span><span className="tipo-dot" style={{ background: tipoColor("Salão") }} /> Salão ({counts.tipo["Salão"]})</span>
              <span style={{ width: 1, height: 14, background: "var(--line)" }} />
              <span><span className="tipo-dot" style={{ background: statusColor("Ativo") }} /> Ativo ({counts.status["Ativo"]})</span>
              <span><span className="tipo-dot" style={{ background: statusColor("Aguardando Contrato") }} /> Aguardando contrato ({counts.status["Aguardando Contrato"]})</span>
              <span><span className="tipo-dot" style={{ background: statusColor("Aguardando Cadastro") }} /> Aguardando cadastro ({counts.status["Aguardando Cadastro"]})</span>
              <span><span className="tipo-dot" style={{ background: statusColor("Aguardando Interação") }} /> Aguardando interação ({counts.status["Aguardando Interação"]})</span>
              {saving && <span className="save-flag">Salvando…</span>}
            </div>
          </div>
        )}

        {tab === "escala" && (
          <div>
            <div className="section-head">
              <div>
                <div className="section-title">Escala online</div>
                <div className="section-note">Selecione o corretor de plantão em cada horário · apenas corretores Híbrido com status Ativo aparecem na lista</div>
              </div>
              <div className="row-actions">
                <button className="btn ghost sm" onClick={clearWeek}>Limpar semana</button>
              </div>
            </div>

            <div className="week-bar">
              <label>Semana a partir de (segunda-feira)</label>
              <input type="date" value={weekStart} onChange={(e) => setWeekStart(toISODate(mondayOf(new Date(e.target.value + "T00:00:00"))))} />
            </div>

            <div className="escala-scroll">
              <table className="escala-table">
                <thead>
                  <tr>
                    <th style={{ background: "var(--navy-2)" }}>Horário</th>
                    {DIAS.map((d, i) => (
                      <th key={d}>{d}<span className="day-date">{fmtDateShort(weekDates[i])}</span></th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {TURNOS.map((turno) => (
                    <Fragment key={turno.id}>
                      <tr className="turno-head">
                        <td colSpan={DIAS.length + 1}>{turno.label} · {turno.horario}</td>
                      </tr>
                      {Array.from({ length: turno.slots }).map((_, slotIdx) => (
                        <tr key={`${turno.id}-${slotIdx}`}>
                          <td className="slot-label">{turno.horario}</td>
                          {DIAS.map((_, dayIdx) => {
                            const cellKey = `${weekStart}|${turno.id}|${slotIdx}|${dayIdx}`;
                            const assignedId = escala[cellKey];
                            const assigned = assignedId ? corretorById[assignedId] : null;
                            return (
                              <td className={`cell ${assigned ? "cell-filled" : ""}`} key={dayIdx}
                                  style={assigned ? { boxShadow: `inset 4px 0 0 ${tipoColor(assigned.tipo)}` } : {}}>
                                <select value={assignedId || ""} onChange={(e) => setCell(cellKey, e.target.value)}>
                                  <option value="">—</option>
                                  {corretoresOrdenados.filter((c) => (c.tipo === "Híbrido" && c.status === "Ativo") || c.id === assignedId).map((c) => (
                                    <option key={c.id} value={c.id}>{c.apelido}</option>
                                  ))}
                                </select>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </Fragment>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="legend">
              <span><span className="tipo-dot" style={{ background: tipoColor("Híbrido") }} /> Híbrido</span>
              <span><span className="tipo-dot" style={{ background: tipoColor("Salão") }} /> Salão</span>
              {saving && <span className="save-flag">Salvando…</span>}
            </div>
          </div>
        )}
      </div>

      <button
        onClick={() => setShowDebug((v) => !v)}
        style={{ position: "fixed", bottom: 10, right: 10, zIndex: 9999, fontSize: 10, padding: "4px 8px", borderRadius: 6, border: "1px solid #DDE2E8", background: "#fff", color: "#5B6675", cursor: "pointer", opacity: 0.7 }}
      >
        sync {debugLog[0] ? (debugLog[0].error ? "⚠️" : debugLog[0].ok ? "✅" : "•") : "…"}
      </button>
      {showDebug && (
        <div style={{ position: "fixed", bottom: 40, right: 10, zIndex: 9999, width: 360, maxHeight: 300, overflow: "auto", background: "#101E33", color: "#DDE2E8", fontSize: 10.5, fontFamily: "monospace", padding: 10, borderRadius: 8, boxShadow: "0 4px 16px rgba(0,0,0,.3)" }}>
          <div style={{ marginBottom: 6, fontWeight: 700 }}>Diagnóstico de sincronização</div>
          {debugLog.length === 0 && <div>sem eventos ainda…</div>}
          {debugLog.map((e, i) => (
            <div key={i} style={{ marginBottom: 4, paddingBottom: 4, borderBottom: "1px solid #1B2E4A" }}>
              <div>{e.ts} · {e.op} · {e.key ? e.key.replace("desidera-", "") : ""}</div>
              {e.status !== undefined && <div>status: {e.status}</div>}
              {e.note && <div style={{ color: "#E8792C" }}>{e.note}</div>}
              {e.error && <div style={{ color: "#ff8080" }}>erro: {e.error}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<Painel />);
</script>
<script>
(function () {
  var src = document.getElementById("app-source").textContent;
  var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
  (0, eval)(out.code);
})();
</script>
</body>
</html>
